name: Showroom loaded still-image review
on:
  push:
    branches:
      - feature/component-showroom
    paths:
      - 'components/scripts/capture-loaded-media.mjs'
      - 'components/scripts/check-loaded-media-batches.mjs'
      - 'components/data/loaded-media-review-batches.json'
      - 'index.html'
      - 'script.js'
      - 'styles.css'
      - 'custom-bakes-gallery.css'
      - 'components/data/template-media-inventory.json'
      # Photo-source, responsive crop or layout changes must trigger real image QA.
      - 'templates/**/index.html'
      - 'templates/**/styles.css'
      - '.github/workflows/showroom-loaded-media-qa.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  still-media-browser:
    name: Real still-image crop evidence (${{ matrix.batch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        batch: [baseline, portfolio, services, professional, campaign, portfolio-extended, retail]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated showroom dependencies
        working-directory: components
        run: npm install --no-audit --no-fund
      - name: Validate and build review pages
        working-directory: components
        run: npm run build
      - name: Confirm system Chrome
        run: command -v google-chrome || command -v chromium
      - name: Decode actual remote and local stills without streaming film
        working-directory: components
        env:
          MEDIA_BATCH: ${{ matrix.batch }}
        run: node scripts/capture-loaded-media.mjs
      - name: Preserve loaded image screenshots and evidence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loaded-still-media-evidence-${{ matrix.batch }}
          path: components/loaded-media-evidence/${{ matrix.batch }}/
          if-no-files-found: warn
          retention-days: 7
