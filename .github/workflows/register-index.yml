name: Register INDEX review template
on:
  push:
    branches: [feature/component-showroom]
    paths:
      - '.github/workflows/register-index.yml'
      - 'components/scripts/prepare-index-registration.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index-registration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    if: github.ref == 'refs/heads/feature/component-showroom'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: components
      - name: Prepare source and gallery-only metadata
        run: node scripts/prepare-index-registration.mjs
        working-directory: components
      - name: Capture actual opening
        run: node scripts/capture-gallery-openings.mjs --only=index-designer --apply
        working-directory: components
      - name: Check full build and membership
        working-directory: components
        run: |
          npm run build
          node --input-type=module -e "import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';import {catalogue} from './builder-model.js';const data=JSON.parse(readFileSync('data/builder-templates.json'));assert.equal(data.length,37);assert.equal(data.find(x=>x.slug==='index-designer').configuratorStatus,'gallery-only');assert.equal(catalogue([],[],data,[]).templates.size,35);"
      - name: Verify registered route specialist
        run: node scripts/test-index-designer.mjs
        working-directory: components
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-registration-evidence
          path: |
            components/gallery-opening-evidence/
            components/index-designer-evidence/
          if-no-files-found: warn
      - name: Commit validated registration candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- templates index.html components/data components/scripts docs .github/workflows/index-designer-review.yml PROJECT-ROADMAP.md
          git diff --cached --stat
          git commit -m "feat(gallery): register INDEX with actual browser opening"
          git push origin HEAD:refs/heads/index-registration/${GITHUB_SHA}
