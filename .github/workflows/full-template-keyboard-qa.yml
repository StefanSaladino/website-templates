name: Full template keyboard navigation QA
on:
  push:
    branches:
      - feature/component-showroom
    paths:
      - 'templates/creative-agency/**'
      - 'templates/editorial-commerce/**'
      - 'templates/muskoka-retreat/**'
      - 'components/scripts/test-template-keyboard.mjs'
      - '.github/workflows/full-template-keyboard-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyboard:
    name: Native keyboard and responsive focus regression
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: components
        run: npm install --no-audit --no-fund
      - name: Build full template routes
        working-directory: components
        run: npm run build
      - name: Run keyboard and focus navigation check without remote media
        working-directory: components
        run: node scripts/test-template-keyboard.mjs
      - name: Store keyboard regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-template-keyboard-evidence
          path: components/template-keyboard-evidence/
          if-no-files-found: warn
          retention-days: 14
