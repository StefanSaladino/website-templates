name: Full template keyboard navigation QA
on:
  push:
    branches:
      - feature/component-showroom
    paths:
      - 'templates/**'
      - 'components/scripts/template-catalogue.mjs'
      - 'components/scripts/test-all-template-baseline.mjs'
      - 'components/scripts/test-nonmenu-template-keyboard.mjs'
      - 'components/scripts/test-app-launch-nav.mjs'
      - 'components/scripts/test-overlay-menu-keyboard.mjs'
      - 'components/scripts/test-waitlist-preview.mjs'
      - 'components/scripts/test-event-launch-keyboard.mjs'
      - 'components/scripts/test-storefront-cart-keyboard.mjs'
      - 'components/scripts/test-law-firm-menu-keyboard.mjs'
      - 'components/scripts/test-template-keyboard.mjs'
      - '.github/workflows/full-template-keyboard-qa.yml'
  workflow_dispatch:

# Keep one current branch/PR run per workflow. Old full-browser jobs should not
# consume minutes after a newer source revision supersedes their evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  keyboard:
    name: Native keyboard and responsive focus regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: components
        run: npm install --no-audit --no-fund
      - name: Build full template routes
        working-directory: components
        run: npm run build
      - name: Run automatically discovered complete-site keyboard baseline
        working-directory: components
        run: npm run check:template-baseline
      - name: Run keyboard and focus navigation check without remote media
        working-directory: components
        run: node scripts/test-template-keyboard.mjs
      - name: Test NORTHLINE animated drawer focus containment and reduced-motion exit
        working-directory: components
        run: node scripts/test-law-firm-menu-keyboard.mjs
      - name: Test MORA demo bag modal focus and local-only purchase feedback
        working-directory: components
        run: node scripts/test-storefront-cart-keyboard.mjs
      - name: Test AFTER DARK animated full-screen navigation and keyboard focus
        working-directory: components
        run: node scripts/test-event-launch-keyboard.mjs
      - name: Check STILL waitlist preview never claims a signup
        working-directory: components
        run: node scripts/test-waitlist-preview.mjs
      - name: Verify GARAGE and MONOLITH focus-contained mobile overlays
        working-directory: components
        run: node scripts/test-overlay-menu-keyboard.mjs
      - name: Check Tide off-canvas menu is inert only on narrow screens
        working-directory: components
        run: node scripts/test-app-launch-nav.mjs
      - name: Verify keyboard-first bypass and controls on architecture, tech and photography sites
        working-directory: components
        run: node scripts/test-nonmenu-template-keyboard.mjs
      - name: Store keyboard regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-template-keyboard-evidence
          path: |
            components/all-template-baseline-evidence/
            components/template-keyboard-evidence/
            components/law-firm-keyboard-evidence/
            components/storefront-cart-keyboard-evidence/
            components/event-launch-keyboard-evidence/
            components/waitlist-preview-evidence/
            components/overlay-menu-keyboard-evidence/
            components/app-launch-nav-evidence/
            components/nonmenu-keyboard-evidence/
          if-no-files-found: warn
          retention-days: 14
