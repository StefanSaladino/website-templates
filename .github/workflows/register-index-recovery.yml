name: Promote verified INDEX review assets
on:
  push:
    branches: [feature/component-showroom]
    paths:
      - '.github/workflows/register-index-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: index-registration-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    if: github.ref == 'refs/heads/feature/component-showroom'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore actual screenshot from successful capture step
        uses: actions/download-artifact@v4
        with:
          name: index-registration-evidence
          run-id: 45507045514
          github-token: ${{ github.token }}
          path: /tmp/index-registration-evidence
      - name: Prepare exact review source and verify captured thumbnail identity
        run: |
          node components/scripts/prepare-index-registration.mjs
          # The connector has already installed the registered-route trigger. Keep
          # workflow files out of the bot-authored registration candidate.
          git restore --source=HEAD -- .github/workflows/index-designer-review.yml
          printf '%s  %s\n' 7c1b73c33d8a00bbae855468f314b89608b57f5988ef09c7884d2d66b846ff5b /tmp/index-registration-evidence/gallery-opening-evidence/index-designer.webp | sha256sum -c -
          cp /tmp/index-registration-evidence/gallery-opening-evidence/index-designer.webp templates/index-designer/gallery-opening.webp
          cp /tmp/index-registration-evidence/gallery-opening-evidence/report.json components/data/gallery-opening-captures.json
          node --input-type=module -e "import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';import {catalogue} from './components/builder-model.js';const data=JSON.parse(readFileSync('components/data/builder-templates.json'));assert.equal(data.length,37);assert.equal(data.find(x=>x.slug==='index-designer').configuratorStatus,'gallery-only');assert.equal(catalogue([],[],data,[]).templates.size,35);"
          node components/scripts/check-gallery-integrity.mjs
          node components/scripts/check-immersive-contract.mjs
          node components/scripts/check-template-media.mjs
          node components/scripts/check-template-media-provenance.mjs
          node components/scripts/check-loaded-media-batches.mjs
      - name: Create review-only candidate for explicit promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- templates index.html components/data components/scripts docs PROJECT-ROADMAP.md
          git commit -m "feat(gallery): register INDEX with verified browser thumbnail"
          git push origin HEAD:refs/heads/index-registration/${GITHUB_SHA}
