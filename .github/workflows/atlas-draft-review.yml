name: ATLAS draft browser review
on:
  push:
    branches: [main]
    paths:
      - 'templates/_drafts/atlas-terrain/**'
      - 'templates/atlas-terrain/**'
      - 'components/scripts/test-atlas-draft.mjs'
      - '.github/workflows/atlas-draft-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    # Four SwiftShader viewports, intermediate captures and real context recovery.
    # Prior runs exhausted ten minutes during desktop, not an assertion failure.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: components
      - run: node scripts/test-atlas-draft.mjs
        working-directory: components
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-browser-evidence
          path: components/atlas-evidence/
