name: Component showroom CI
on:
  push:
    branches:
      - feature/component-showroom
    paths:
      - 'components/**'
      - 'templates/**'
      - 'docs/COMPONENT-**'
      - '.github/workflows/component-showroom-ci.yml'
  pull_request:
    paths:
      - 'components/**'
      - 'templates/**'
      - 'docs/COMPONENT-**'
      - '.github/workflows/component-showroom-ci.yml'
# Keep one current branch/PR run per workflow. Old full-browser jobs should not
# consume minutes after a newer source revision supersedes their evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  validate-build:
    name: Validate isolated showroom
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: components
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install component dependencies
        run: npm install --no-audit --no-fund
      - name: Validate all metadata and in-review previews
        run: npm run check
      - name: Build catalogue and review routes
        run: npm run build
      - name: Verify built GitHub Pages subpath output
        run: node scripts/check-dist.mjs
      - name: Confirm preinstalled Chrome
        run: command -v google-chrome || command -v chromium
      - name: Test viewer interactions and scrolling in Chromium
        run: npm run check:browser
      - name: Save browser review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-browser-smoke
          path: components/component-browser-evidence
          if-no-files-found: ignore
          retention-days: 7
      - name: Store build for review
        uses: actions/upload-artifact@v4
        with:
          name: component-showroom-build
          path: dist
          if-no-files-found: error
          retention-days: 7
