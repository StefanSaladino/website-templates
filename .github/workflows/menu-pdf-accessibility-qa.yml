name: Tagged sample PDF render and text QA
on:
  push:
    branches:
      - feature/component-showroom
    paths:
      - 'components/previews/MENU-04/**'
      - 'components/scripts/inspect-menu-pdf.mjs'
      - '.github/workflows/menu-pdf-accessibility-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    name: PDF generation, text extraction and rendered page
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install showroom dependencies
        working-directory: components
        run: npm install --no-audit --no-fund
      - name: Validate and build component showroom
        working-directory: components
        run: npm run build
      - name: Ensure PDF text tools and renderer are available
        run: |
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Validate actual generated PDF
        working-directory: components
        run: node scripts/inspect-menu-pdf.mjs
      - name: Preserve tagged PDF and rendered-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-04-pdf-review-evidence
          path: components/menu-pdf-evidence/
          if-no-files-found: warn
          retention-days: 14
