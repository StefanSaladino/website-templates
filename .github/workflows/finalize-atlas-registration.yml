name: Finalize approved ATLAS registration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-atlas-registration.yml']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove the exact merged ATLAS candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=atlas-registration/6dc61989dd21f05b6ebe9d0234485ea29522a137
          expected=d5d5324e24f2bb717bb9f5149342b3ed3b6739bd
          git fetch origin main
          actual=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          if [ -z "$actual" ]; then echo "Already removed"; exit 0; fi
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$actual" origin/main
          test "$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq length)" = 0
          git push --force-with-lease="refs/heads/$branch:$expected" origin ":refs/heads/$branch"
