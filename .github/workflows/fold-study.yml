name: FOLD geometric interaction review
on:
  push:
    branches: [feature/component-showroom]
    paths:
      - 'templates/_drafts/fold-paper-studio/**'
      - 'templates/fold-paper-studio/**'
      - 'components/scripts/test-fold-study.mjs'
      - '.github/workflows/fold-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: components
      - run: node scripts/test-fold-study.mjs
        working-directory: components
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fold-geometric-evidence
          path: components/fold-evidence/
          if-no-files-found: warn
