name: THRESHOLD David gallery review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'templates/_drafts/threshold-studio/src/david.js'
      - 'templates/_drafts/threshold-studio/audit/david-review.mjs'
      - '.github/workflows/threshold-david-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: components
      - run: npx playwright install --with-deps chromium
        working-directory: components
      - name: Review actual David mesh in persistent scene
        working-directory: components
        run: |
          python3 -m http.server 4382 --bind 127.0.0.1 --directory .. >/tmp/david-server.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -I http://127.0.0.1:4382/templates/_drafts/threshold-studio/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module < ../templates/_drafts/threshold-studio/audit/david-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threshold-david-gallery-review
          path: /tmp/david-review/
