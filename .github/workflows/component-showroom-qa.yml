name: Component showroom review QA
on:
  push:
    branches:
      - feature/component-showroom
    paths:
      - 'components/**'
      - 'templates/**'
      - '.github/workflows/component-showroom-qa.yml'
  pull_request:
    paths:
      - 'components/**'
      - 'templates/**'
      - '.github/workflows/component-showroom-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-browser-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the review branch
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated showroom dependencies
        working-directory: components
        run: npm install --no-audit --no-fund

      - name: Check and build full responsive showroom
        working-directory: components
        run: npm run build

      - name: Install Playwright Chromium and required system libraries
        working-directory: components
        run: npx playwright install --with-deps chromium

      - name: Confirm Python for local showroom HTTP server
        run: python3 --version

      - name: Execute Chromium interaction and responsive smoke suite
        working-directory: components
        run: npm run check:browser

      - name: Preserve QA screenshots, result ledger and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showroom-browser-evidence
          path: components/component-browser-evidence/
          if-no-files-found: warn
          retention-days: 14
