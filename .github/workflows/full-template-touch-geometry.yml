name: Full template touch target geometry review
on:
  push:
    branches:
      - feature/component-showroom
    paths:
      - 'components/scripts/audit-template-touch-geometry.mjs'
      - '.github/workflows/full-template-touch-geometry.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    name: Browser touch-target geometry evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: components
        run: npm install --no-audit --no-fund
      - name: Build original templates
        working-directory: components
        run: npm run build
      - name: Capture geometry at 320, 390, 768 and 1280px
        working-directory: components
        run: node scripts/audit-template-touch-geometry.mjs
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-template-touch-geometry
          path: components/touch-geometry-evidence/
          if-no-files-found: warn
          retention-days: 14
