name: MATTER draft browser review
on:
  push:
    branches: [main]
    paths:
      - 'templates/_drafts/matter-exhibition/**'
      - 'templates/matter-exhibition/**'
      - 'components/scripts/test-matter-draft.mjs'
      - '.github/workflows/matter-draft-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: components
      - run: node scripts/test-matter-draft.mjs
        working-directory: components
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matter-browser-evidence
          path: components/matter-evidence/
