name: INDEX designer portfolio review
on:
  push:
    branches: [feature/component-showroom]
    paths:
      - 'templates/_drafts/index-designer/**'
      - 'templates/index-designer/**'
      - 'components/scripts/test-index-designer.mjs'
      - 'components/scripts/register-index-designer.mjs'
      - '.github/workflows/index-designer-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    if: github.ref == 'refs/heads/feature/component-showroom'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: components
      - name: Verify portfolio routes
        working-directory: components
        run: node scripts/test-index-designer.mjs
      - name: Prepare registration candidate from actual screenshot
        working-directory: components
        run: node scripts/register-index-designer.mjs
      - name: Verify full build and registered routes
        working-directory: components
        run: |
          npm run build
          node scripts/test-index-designer.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-designer-review
          path: components/index-designer-evidence/
      - name: Publish review candidate only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- templates index.html components/data/builder-templates.json docs/INDEX-DESIGNER-ROADMAP.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(gallery): register INDEX designer portfolio"
          git push origin HEAD:refs/heads/index-designer-registration/${GITHUB_SHA}
