name: Original template photo candidate review
on:
  workflow_dispatch:
    inputs:
      template:
        description: "Original template folder to inspect"
        required: true
        default: "frame-portfolio"
        type: choice
        options:
          - frame-portfolio
          - editorial-commerce
          - muskoka-retreat
          - creative-agency
          - garage-detailing
          - real-estate
          - monolith-architecture
          - woodworker
          - event-launch
          - custom-bakes
          - storefront
          - landscaping
          - restaurant
          - pools
          - fitness-launch
          - tattoo-studio
          - architecture
          - contractor
          - law-firm
      limit:
        description: "Maximum candidate identities for other templates"
        required: true
        default: "5"
        type: choice
        options: ["1", "3", "5", "10"]
      frame_batch:
        description: "FRAME photo batch (ignored for other templates)"
        required: true
        default: "remaining-six"
        type: choice
        options:
          - first-five
          - remaining-six
          - all-eleven
  push:
    branches:
      - feature/component-showroom
    paths:
      - '.github/workflows/component-template-media-candidates.yml'
      - 'components/scripts/prepare-template-media-review.mjs'

permissions:
  contents: read

jobs:
  candidate-evidence:
    name: Candidate images for local review only
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: components
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated showroom dependencies
        run: npm install --no-audit --no-fund
      - name: Verify inventory and offline review behavior
        run: npm run check:template-media && npm run check:template-media-review
      - name: Generate candidate images (unapproved, not for redistribution)
        env:
          TEMPLATE_NAME: ${{ inputs.template || 'custom-bakes' }}
          CANDIDATE_LIMIT: ${{ inputs.limit || '5' }}
          FRAME_BATCH: ${{ inputs.frame_batch || 'remaining-six' }}
        run: |
          if [ "$TEMPLATE_NAME" = "frame-portfolio" ]; then
            case "$FRAME_BATCH" in
              first-five)
                npm run review:template-media -- --ids=TM-002,TM-003,TM-004,TM-007,TM-009 --limit=5
                ;;
              remaining-six)
                npm run review:template-media -- --ids=TM-012,TM-013,TM-014,TM-015,TM-016,TM-017 --limit=6
                ;;
              all-eleven)
                npm run review:template-media -- --templates=frame-portfolio --limit=11
                ;;
              *)
                echo "Unsupported FRAME batch: $FRAME_BATCH" >&2
                exit 1
                ;;
            esac
          else
            npm run review:template-media -- --templates="$TEMPLATE_NAME" --limit="$CANDIDATE_LIMIT"
          fi
      - name: Verify all generated crop alternatives
        if: success()
        env:
          TEMPLATE_NAME: ${{ inputs.template || 'custom-bakes' }}
          FRAME_BATCH: ${{ inputs.frame_batch || 'remaining-six' }}
        run: |
          node --input-type=module -e '
          import {readFileSync,existsSync} from "node:fs";
          import assert from "node:assert/strict";
          const report=JSON.parse(readFileSync("../stock-candidates/template-review/results.json","utf8"));
          if(process.env.TEMPLATE_NAME==="custom-bakes"){
            assert.deepEqual(report.assets.map(x=>x.id),["TM-029","TM-037","TM-060"],"Wrong DOT + CRUMB photo identities");
            assert.equal(report.downloaded,3);
          }
          if(process.env.TEMPLATE_NAME==="event-launch"){
            assert.deepEqual(report.assets.map(x=>x.id),["TM-045","TM-049","TM-052","TM-056"],"Wrong AFTER DARK photo identities");
            assert.equal(report.downloaded,4);
          }
          if(process.env.TEMPLATE_NAME==="woodworker"){
            assert.deepEqual(report.assets.map(x=>x.id),["TM-043","TM-048","TM-054","TM-055"],"Wrong woodworker photo identities");
            assert.equal(report.downloaded,4);
          }
          if(process.env.TEMPLATE_NAME==="monolith-architecture"){
            assert.deepEqual(report.assets.map(x=>x.id),["TM-022","TM-023","TM-024","TM-025"],"Wrong MONOLITH photo identities");
            assert.equal(report.downloaded,4);
          }
          if(process.env.TEMPLATE_NAME==="real-estate"){
            assert.deepEqual(report.assets.map(x=>x.id),["TM-011","TM-041","TM-057","TM-062"],"Wrong real-estate photo identities");
            assert.equal(report.downloaded,4);
          }
          if(process.env.TEMPLATE_NAME==="garage-detailing"){
            assert.deepEqual(report.assets.map(x=>x.id),["TM-006","TM-019","TM-020","TM-033"],"Wrong garage-detailing photo identities");
            assert.equal(report.downloaded,4);
          }
          if(process.env.TEMPLATE_NAME==="creative-agency"){
            assert.deepEqual(report.assets.map(x=>x.id),["TM-001","TM-071"],"Wrong creative agency media identities");
            assert.equal(report.downloaded,1,"Expected poster only, never full video download");
            assert.equal(report.assets[1].candidateStatus,"video-manual-review");
            assert(report.assets[1].videoProbe,"Expected non-streaming video HEAD probe status");
          }
          if(process.env.TEMPLATE_NAME==="muskoka-retreat"){
            assert.deepEqual(report.assets.map(x=>x.id),["TM-021","TM-031","TM-036","TM-061","TM-070"],"Wrong Muskoka batch");
            assert.equal(report.downloaded,5);
          }
          if(process.env.TEMPLATE_NAME==="editorial-commerce"){
            assert.deepEqual(report.assets.map(x=>x.id),["TM-005","TM-008","TM-026","TM-027","TM-028","TM-032","TM-039","TM-044","TM-065"],"Wrong editorial-commerce batch");
            assert.equal(report.downloaded,9);
          }
          if(process.env.TEMPLATE_NAME==="frame-portfolio" && process.env.FRAME_BATCH==="remaining-six"){
            assert.deepEqual(report.assets.map(x=>x.id),["TM-012","TM-013","TM-014","TM-015","TM-016","TM-017"],"Wrong FRAME follow-up batch");
            assert.equal(report.downloaded,6);
          }
          for(const item of report.assets.filter(x=>x.kind==="image")){
            assert.equal(item.candidateStatus,"downloaded-for-review");
            for(const field of ["original","wide","desktopPortrait","desktopLandscape","phoneCenter","phoneAttention","phoneFull","phoneTall"])
              assert(existsSync("../stock-candidates/template-review/"+item[field]),item.id+" missing "+field);
          }
          console.log("Verified "+report.downloaded+" unapproved candidate photos with all phone crop alternatives");
          '
      - name: Preserve candidate contact sheet, crops and review ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-template-media-candidates
          path: stock-candidates/template-review/
          if-no-files-found: warn
          retention-days: 7
