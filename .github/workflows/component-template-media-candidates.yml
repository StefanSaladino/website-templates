name: Original template photo candidate review
# On-demand acquisition is separate from repeatable offline/source QA. Current
# manifest membership determines candidates; retired IDs are never hardcoded.
on:
  workflow_dispatch:
    inputs:
      template:
        description: "Current full website template folder"
        required: true
        default: "frame-portfolio"
        type: string
      limit:
        description: "Maximum active candidate identities"
        required: true
        default: "10"
        type: string
permissions:
  contents: read
jobs:
  candidate-evidence:
    name: Candidate media for local review only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: components
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check:template-media && npm run check:template-media-review
      - name: Generate current unapproved media candidates
        env:
          TEMPLATE_NAME: ${{ inputs.template }}
          CANDIDATE_LIMIT: ${{ inputs.limit }}
        run: npm run review:template-media -- --templates="$TEMPLATE_NAME" --limit="$CANDIDATE_LIMIT"
      - name: Verify selection and generated crop alternatives against active inventory
        env:
          TEMPLATE_NAME: ${{ inputs.template }}
          CANDIDATE_LIMIT: ${{ inputs.limit }}
        run: |
          node --input-type=module -e '
          import {readFileSync,existsSync} from "node:fs";
          import assert from "node:assert/strict";
          const manifest=JSON.parse(readFileSync("data/template-media-inventory.json","utf8"));
          const limit=Number(process.env.CANDIDATE_LIMIT);
          assert(Number.isInteger(limit)&&limit>0);
          const expected=manifest.assets.filter(asset=>asset.usages.some(use=>use.templateId===process.env.TEMPLATE_NAME)).slice(0,limit);
          assert(expected.length>0,"No active media for selected template");
          const report=JSON.parse(readFileSync("../stock-candidates/template-review/results.json","utf8"));
          assert.deepEqual(report.assets.map(x=>x.id),expected.map(x=>x.id),"Candidate selection must match active inventory");
          assert.equal(report.errors,0);
          assert.equal(report.downloaded,expected.filter(x=>x.kind==="image").length);
          for(const item of report.assets){
            if(item.kind==="video"){
              assert.equal(item.candidateStatus,"video-manual-review");
              assert.equal(item.videoProbe.downloadedMediaBytes,0);
              continue;
            }
            assert.equal(item.candidateStatus,"downloaded-for-review");
            for(const field of ["original","wide","desktopPortrait","desktopLandscape","phoneCenter","phoneAttention","phoneFull","phoneTall"])
              assert(existsSync("../stock-candidates/template-review/"+item[field]),item.id+" missing "+field);
          }
          console.log("Verified "+report.downloaded+" unapproved active image candidates and video HEAD-only records");
          '
      - name: Preserve candidate review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-template-media-candidates
          path: stock-candidates/template-review/
          if-no-files-found: warn
          retention-days: 7
