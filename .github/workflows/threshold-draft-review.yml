              };
              await move(.70);
              await page.waitForFunction(()=>document.querySelector('.journey-stage').dataset.exploration==='active');
              const unbacked=async selector=>{
                const states=await page.locator(selector).evaluateAll(els=>els.filter(e=>e.getClientRects().length).map(e=>({background:getComputedStyle(e).backgroundColor,shadow:getComputedStyle(e).boxShadow})));
                assert(states.length>0);
                assert(states.every(s=>s.background==='rgba(0, 0, 0, 0)'&&s.shadow==='none'),'editorial copy must not have a backing block');
              };
              const brightPixels=async()=>{
                const image=await page.screenshot({style:'.masthead,.opening-copy,.display-wordmark,.perspective-editorial,.exploration,.possibility,footer,.skip-link{visibility:hidden!important}'});
                const {data,info}=await sharp(image).removeAlpha().raw().toBuffer({resolveWithObject:true});let bright=0;
                for(let i=0;i<data.length;i+=info.channels)if(data[i]>230&&data[i+1]>230&&data[i+2]>230)bright++;
                return bright/(info.width*info.height);
              };
              const beforeLight=await brightPixels();assert(beforeLight<.001,'white exit remains unlit in Exploration');
              await unbacked('.exploration-intro,.exploration-projects');
              await check('index','.masthead a,.exploration-intro p,.exploration-intro h2,.exploration-projects > p,.exploration-projects .project-name,.exploration-projects .project-number,.journey-next');
              for(const [i,key] of ['parallax','form','signal'].entries()){
                await page.locator('.exploration summary').nth(i).click();await page.locator('[data-'+key+'-launch]').click();
                await unbacked('.'+key+'-copy,.'+key+'-controls');
                await check(key,'.masthead a,.'+key+'-copy p,.'+key+'-copy h3,.'+key+'-copy button,.'+key+'-controls .parallax-status label,.'+key+'-controls .parallax-status output,.'+key+'-controls .parallax-status > span,.'+key+'-controls button');
                await page.locator('[data-'+key+'-return]').click();
              }
              await move(1);await page.waitForFunction(()=>document.querySelector('.possibility').style.getPropertyValue('--possibility-opacity')==='1');
              const afterLight=await brightPixels();assert(afterLight>.005,'white doorway is revealed at the final viewpoint');
              await unbacked('.possibility-copy');
              await check('closing','.masthead a,.possibility-copy p,.possibility-copy h2,.possibility-cta,.journey-back');
              await page.locator('.possibility-cta').click();
              await unbacked('.possibility-contact');
              assert(await brightPixels()<.001,'contact dims architecture instead of adding a block');
              await check('contact','.masthead a,.possibility-contact p,.possibility-contact h3,.possibility-contact label,.possibility-contact button');
              contrastEvidence.push(record);await page.close();
            }
            writeFileSync('/tmp/threshold-evidence/contrast-review.json',JSON.stringify(contrastEvidence,null,2));

            const moving=await browser.newPage({viewport:{width:1024,height:768},deviceScaleFactor:1});
            const movingErrors=[];moving.on('pageerror',e=>movingErrors.push(e.message));
            await moving.goto(baseURL+'?journey=off');
            const movingStage=moving.locator('#scene-study'),movingCanvas=moving.locator('#scene-canvas');
            await moving.waitForFunction(()=>document.querySelector('#scene-study').dataset.renderer==='webgl'&&document.querySelector('#scene-study').dataset.ambient==='on');
            const maskBefore=await moving.locator('#wordmark-occluder').getAttribute('points');
            const early=await movingCanvas.screenshot({style:captureStyle,path:'/tmp/threshold-evidence/ambient-early.png'});
            const start=Number(await movingStage.getAttribute('data-ambient-elapsed'));
            const firstFrames=Number(await movingStage.getAttribute('data-frames'));
            await moving.waitForFunction(n=>Number(document.querySelector('#scene-study').dataset.ambientElapsed)>n+2500,start,{timeout:20000});
            const later=await movingCanvas.screenshot({style:captureStyle,path:'/tmp/threshold-evidence/ambient-later.png'});
            assert(Number(await movingStage.getAttribute('data-frames'))>firstFrames+10);
            assert.equal(await moving.locator('#wordmark-occluder').getAttribute('points'),maskBefore,'fixed camera projection');
            const a=await sharp(early).removeAlpha().raw().toBuffer({resolveWithObject:true}),b=await sharp(later).removeAlpha().raw().toBuffer({resolveWithObject:true});
            assert.equal(a.info.width,b.info.width);assert.equal(a.info.height,b.info.height);
            let changed=0,maxDelta=0;
            for(let i=0;i<a.data.length;i+=a.info.channels){
              const d=Math.max(...[0,1,2].map(k=>Math.abs(a.data[i+k]-b.data[i+k])));
              if(d>=2)changed++;maxDelta=Math.max(maxDelta,d);
            }
            console.log('Ambient pixel change',{changed,maxDelta});
            assert(changed>100&&maxDelta<=26,'subtle actual illumination motion');
            // Ordered actual render frames for review; active clock samples, not invented video.
            const motionFrames=[];
            for(let i=0;i<6;i++){
              const phase=Number(await movingStage.getAttribute('data-ambient-elapsed'));
              const name='motion-'+String(i).padStart(2,'0')+'.png';
              await moving.screenshot({path:'/tmp/threshold-evidence/'+name});
              motionFrames.push({name,activeTime:phase,frames:Number(await movingStage.getAttribute('data-frames'))});
              await moving.waitForTimeout(350);
            }
            writeFileSync('/tmp/threshold-evidence/motion-frames.json',JSON.stringify(motionFrames,null,2));
            // Record actual preference delivery independently of the app's response.
            await moving.evaluate(()=>{
              const query=matchMedia('(prefers-reduced-motion: reduce)');
              window.__preferenceReview={query,events:[]};
              query.addEventListener('change',e=>window.__preferenceReview.events.push({matches:e.matches,at:performance.now()}));
            });
            await moving.emulateMedia({reducedMotion:'reduce'});
            try{
              await moving.waitForFunction(()=>matchMedia('(prefers-reduced-motion: reduce)').matches);
              await moving.waitForFunction(()=>document.querySelector('#scene-study').dataset.reason==='reduced-motion');
              assert(await movingCanvas.isHidden());
              assert(await moving.locator('.scene-fallback').isVisible());
            }catch(error){
              const detail=await moving.evaluate(()=>({
                matches:matchMedia('(prefers-reduced-motion: reduce)').matches,
                observed:window.__preferenceReview.query.matches,
                events:window.__preferenceReview.events,
                state:{...document.querySelector('#scene-study').dataset},
                hidden:document.hidden,canvasHidden:document.querySelector('#scene-canvas').hidden
              }));
              writeFileSync('/tmp/threshold-evidence/preference-failure.json',JSON.stringify(detail,null,2));
              await moving.screenshot({path:'/tmp/threshold-evidence/preference-failure.png'});
              console.error('Preference diagnostic',detail);throw error;
            }
            const frozen=Number(await movingStage.getAttribute('data-ambient-elapsed')),frozenFrames=await movingStage.getAttribute('data-frames');
            await moving.waitForTimeout(500);
            assert.equal(await movingStage.getAttribute('data-frames'),frozenFrames);
            assert.equal(Number(await movingStage.getAttribute('data-ambient-elapsed')),frozen);
            await moving.emulateMedia({reducedMotion:'no-preference'});
            await moving.waitForFunction(()=>document.querySelector('#scene-study').dataset.renderer==='webgl');
            const resumed=Number(await movingStage.getAttribute('data-ambient-elapsed'));
            assert(resumed>=frozen&&resumed-frozen<350,'no phase catch-up');
            assert.deepEqual(movingErrors,[]);await moving.close();
            // Desktop static fallback retains the same full viewport and usable copy.
            for(const opts of [{javaScriptEnabled:false},{reducedMotion:'reduce'}]){
              const staticDesktop=await browser.newPage({viewport:{width:1440,height:900},...opts});
              await staticDesktop.goto(baseURL+'?track=exhibition');
              assert(await staticDesktop.locator('h1').isVisible());
              assert(await staticDesktop.locator('.display-wordmark').isVisible());
              assert.equal(await staticDesktop.locator('#wordmark-occluder').getAttribute('points'),'');
              assert(await staticDesktop.locator('.scene-fallback').isVisible());
              assert(await staticDesktop.locator('#scene-canvas').isHidden());
              assert(await staticDesktop.evaluate(()=>{const s=document.scrollingElement,e=document.querySelector('.perspective-editorial'),a=document.querySelector('.opening').getBoundingClientRect(),b=e.getBoundingClientRect();return s.scrollWidth<=s.clientWidth+1&&b.height>80&&Math.abs(a.bottom-b.top)<2&&Math.abs(b.bottom-document.querySelector('.exploration').getBoundingClientRect().top)<3&&Math.abs(document.querySelector('.exploration').getBoundingClientRect().bottom+s.scrollTop-s.scrollHeight)<3&&document.querySelectorAll('.exploration details').length===3&&getComputedStyle(e).opacity==='1'&&e.querySelectorAll('li').length===3}));
              await staticDesktop.screenshot({path:'/tmp/threshold-evidence/desktop-static-'+(opts.javaScriptEnabled===false?'nojs':'reduced')+'.png'});
              await staticDesktop.locator('.perspective-editorial').scrollIntoViewIfNeeded();
