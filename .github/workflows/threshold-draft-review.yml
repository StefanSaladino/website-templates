            }
            for(const opts of [{javaScriptEnabled:false},{reducedMotion:'reduce'}]) {
              const page=await browser.newPage({viewport:{width:390,height:844},...opts});
              assert((await page.goto(baseURL+'?track=exhibition')).ok());
              assert(await page.locator('h1').isVisible());
              assert(await page.locator('#scene-canvas').isHidden());
              assert(await page.locator('.scene-fallback').isVisible());
              assert(await page.locator('.fallback-portrait').isVisible());
              assert(await page.evaluate(()=>{const s=document.scrollingElement,e=document.querySelector('.perspective-editorial'),a=document.querySelector('.opening').getBoundingClientRect(),b=e.getBoundingClientRect();return s.scrollWidth<=s.clientWidth+1&&b.height>80&&Math.abs(a.bottom-b.top)<2&&Math.abs(b.bottom-document.querySelector('.exploration').getBoundingClientRect().top)<3&&Math.abs(document.querySelector('.exploration').getBoundingClientRect().bottom+s.scrollTop-s.scrollHeight)<3&&document.querySelectorAll('.exploration details').length===3&&getComputedStyle(e).opacity==='1'&&e.querySelectorAll('li').length===3}));
