              const section=page.locator('.possibility'),cta=section.locator('.possibility-cta');
              assert(await cta.isVisible());await cta.click();
              const contact=section.locator('.possibility-contact');assert(await contact.isVisible());
              await contact.locator('input').nth(2).check();
              await contact.locator('[data-possibility-create]').click();
              assert.equal(await contact.locator('output').textContent(),'Local brief: Creative technology. Nothing has been submitted.');
              await page.screenshot({path:'/tmp/threshold-evidence/closing-'+width+'x'+height+'-contact.png'});
              const bounds=await contact.evaluate(e=>({box:e.getBoundingClientRect().toJSON(),header:document.querySelector('.masthead').getBoundingClientRect().bottom,children:[...e.querySelectorAll('button,label,output,h3')].map(x=>({text:x.textContent,r:x.getBoundingClientRect().toJSON(),target:x.matches('button,label')}))}));
              assert(bounds.box.top>=bounds.header-1&&bounds.box.bottom<=height+1,'contact fits stage '+width+'x'+height+' '+JSON.stringify(bounds));
              for(const {text,r,target} of bounds.children){assert(r.top>=bounds.header-1&&r.bottom<=height+1&&r.left>=0&&r.right<=width+1,'contact content fits '+text);if(target)assert(r.height>=44,'contact target '+text);}
              await page.keyboard.press('Escape');assert(!(await contact.isVisible()));assert(await cta.evaluate(e=>e===document.activeElement));
              assert.deepEqual(errors,[]);closingEvidence.push(record);await handle.dispose();await page.close();
            }
            writeFileSync('/tmp/threshold-evidence/closing-review.json',JSON.stringify(closingEvidence,null,2));
            // P07b: inspect actual background pixels underneath text, with the
            // glyphs temporarily hidden, rather than trusting a CSS color alone.
            const contrastEvidence=[];
            for(const [width,height] of [[320,568],[390,844],[768,1024],[1440,900],[844,390]]){
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              await page.goto(baseURL+'?ambient=off');
              await page.waitForFunction(()=>document.documentElement.dataset.journey==='on');
              const move=async p=>{
                await page.evaluate(p=>{const s=document.scrollingElement;s.scrollTop=Math.round((s.scrollHeight-s.clientHeight)*p)},p);
                await page.waitForFunction(p=>Math.abs(+document.querySelector('#scene-study').dataset.progress-p)<.002,p);
              };
              const luminance=rgb=>rgb.map(v=>{const x=v/255;return x<=.04045?x/12.92:((x+.055)/1.055)**2.4}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0);
              const record={width,height,states:[]};
              const check=async(name,selector)=>{
                const elements=await page.locator(selector).evaluateAll(els=>els.filter(e=>e.getClientRects().length&&getComputedStyle(e).visibility==='visible').map(e=>{
                  const s=getComputedStyle(e),walker=document.createTreeWalker(e,NodeFilter.SHOW_TEXT),rects=[];let node;
