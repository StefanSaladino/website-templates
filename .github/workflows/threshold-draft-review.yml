                }));
                assert(elements.length>0,name+' text exists');
                const image=await page.screenshot({style:'.masthead a,.masthead a sup,.exploration p,.exploration h2,.exploration h3,.exploration summary,.exploration summary span,.exploration button,.exploration button span,.exploration output,.exploration label,.parallax-status span,.possibility p,.possibility h2,.possibility h3,.possibility button,.possibility label,.possibility legend,.possibility output{color:transparent!important;text-shadow:none!important}',path:'/tmp/threshold-evidence/contrast-background-'+width+'x'+height+'-'+name+'.png'});
                const {data,info}=await sharp(image).removeAlpha().raw().toBuffer({resolveWithObject:true});
                let worst=Infinity;
                for(const e of elements)for(const r of e.rects){
                  assert(r.top>=0&&r.bottom<=height+1&&r.left>=0&&r.right<=width+1,'text remains in viewport '+e.text);
                  // Sample interior of text boxes; avoid borders and focus outlines.
                  for(const u of [.2,.5,.8])for(const v of [.35,.5,.65]){
                    const x=Math.max(0,Math.min(width-1,Math.floor(r.left+r.width*u))),y=Math.max(0,Math.min(height-1,Math.floor(r.top+r.height*v)));
                    const offset=(y*info.width+x)*info.channels,back=Array.from(data.slice(offset,offset+3));
                    const a=luminance(e.rgb),b=luminance(back),ratio=(Math.max(a,b)+.05)/(Math.min(a,b)+.05);
                    worst=Math.min(worst,ratio);assert(ratio>=4.5,name+' contrast '+e.text+' '+ratio.toFixed(2));
                  }
