              assert(await staticDesktop.evaluate(()=>{const s=document.scrollingElement,e=document.querySelector('.perspective-editorial'),a=document.querySelector('.opening').getBoundingClientRect(),b=e.getBoundingClientRect();return s.scrollWidth<=s.clientWidth+1&&b.height>80&&Math.abs(a.bottom-b.top)<2&&Math.abs(b.bottom+s.scrollTop-s.scrollHeight)<3&&getComputedStyle(e).opacity==='1'&&e.querySelectorAll('li').length===3}));
              await staticDesktop.screenshot({path:'/tmp/threshold-evidence/desktop-static-'+(opts.javaScriptEnabled===false?'nojs':'reduced')+'.png'});
              await staticDesktop.locator('.perspective-editorial').scrollIntoViewIfNeeded();
              await staticDesktop.screenshot({path:'/tmp/threshold-evidence/desktop-static-editorial-'+(opts.javaScriptEnabled===false?'nojs':'reduced')+'.png'});
              await staticDesktop.close();
            }
            for(const opts of [{javaScriptEnabled:false},{reducedMotion:'reduce'}]) {
              const page=await browser.newPage({viewport:{width:390,height:844},...opts});
              assert((await page.goto(baseURL)).ok());
              assert(await page.locator('h1').isVisible());
              assert(await page.locator('#scene-canvas').isHidden());
              assert(await page.locator('.scene-fallback').isVisible());
              assert(await page.locator('.fallback-portrait').isVisible());
              assert(await page.evaluate(()=>{const s=document.scrollingElement,e=document.querySelector('.perspective-editorial'),a=document.querySelector('.opening').getBoundingClientRect(),b=e.getBoundingClientRect();return s.scrollWidth<=s.clientWidth+1&&b.height>80&&Math.abs(a.bottom-b.top)<2&&Math.abs(b.bottom+s.scrollTop-s.scrollHeight)<3&&getComputedStyle(e).opacity==='1'&&e.querySelectorAll('li').length===3}));
              assert(await page.locator('#perspective-heading').isVisible());
              await page.screenshot({path:'/tmp/threshold-evidence/portrait-static-'+(opts.javaScriptEnabled===false?'nojs':'reduced')+'.png'});
              await page.close();
            }
            const unavailable=await browser.newPage({viewport:{width:390,height:844}});
            await unavailable.addInitScript(()=>{const original=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,...args){return type==='webgl2'?null:original.call(this,type,...args)}});
            await unavailable.goto(baseURL);
            await unavailable.locator('#scene-study').scrollIntoViewIfNeeded();
            await unavailable.waitForFunction(()=>document.querySelector('#scene-study').dataset.reason==='graphics-unavailable');
            assert(await unavailable.locator('.scene-fallback').isVisible());
            assert(await unavailable.evaluate(()=>{const s=document.scrollingElement,e=document.querySelector('.perspective-editorial'),a=document.querySelector('.opening').getBoundingClientRect(),b=e.getBoundingClientRect();return s.scrollWidth<=s.clientWidth+1&&b.height>80&&Math.abs(a.bottom-b.top)<2&&Math.abs(b.bottom+s.scrollTop-s.scrollHeight)<3&&getComputedStyle(e).opacity==='1'&&e.querySelectorAll('li').length===3}),'graphics fallback has no empty travel');await unavailable.close();
            writeFileSync('/tmp/threshold-evidence/report.json',JSON.stringify({release:'T23',verification:'T23',commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,viewports:7,pixelChecks:true,architecture:true,reflection:true,lighting:true,desktopComposition:true,identity:true,ambient:true,mobileComposition:true,openingReview:true,nativeScroll:true,cameraApproach:true,typographyExit:true,physicalCrossing:true,ivoryReveal:true,perspectiveArchitecture:true,sculptures:true,foldMotion:true,perspectiveEditorial:true,galleryFraming:true,resize:true,idle:true,offscreen:true,contextRecovery:true,staticFallbacks:true},null,2));
            console.log('PASS: seven viewport pixel/lifecycle checks and static fallbacks');
          } finally {await browser.close()}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threshold-perspective-refinement-evidence
          path: /tmp/threshold-evidence/

  transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: components
      - run: npx playwright install --with-deps chromium
        working-directory: components
      - name: T18 dense reversible transition and native scroll recording
        working-directory: components
        run: |
          python3 -m http.server 4381 --bind 127.0.0.1 --directory .. >/tmp/threshold-transition-server.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -I http://127.0.0.1:4381/templates/_drafts/threshold-studio/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module < ../templates/_drafts/threshold-studio/audit/transition.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threshold-T23-transition-evidence
          path: /tmp/threshold-transition/
