name: THRESHOLD draft review
on:
  push:
    branches: [main]
    paths:
      - 'templates/_drafts/threshold-studio/**'
      - '.github/workflows/threshold-draft-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: templates/_drafts/threshold-studio
      - run: npm install --no-audit --no-fund
        working-directory: components
      - run: npx playwright install --with-deps chromium
        working-directory: components
      - name: Check draft route and WebGL foundation
        working-directory: components
        run: |
          python3 -m http.server 4381 --bind 127.0.0.1 --directory .. >/tmp/threshold-server.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -I http://127.0.0.1:4381/templates/_drafts/threshold-studio/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          import sharp from 'sharp';
          import {mkdirSync,writeFileSync} from 'node:fs';
          mkdirSync('/tmp/threshold-evidence',{recursive:true});
          const baseURL='http://127.0.0.1:4381/templates/_drafts/threshold-studio/';
          const url=baseURL+'?ambient=off';
          const captureStyle='.masthead,.opening-copy,.display-wordmark,footer,.skip-link{visibility:hidden!important} main{outline:none!important}';
          const browser=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          try {
            for(const [width,height] of [[320,568],[390,844],[768,1024],[1024,768],[1440,900],[1920,1080],[844,390]]) {
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:width<=390?3:2});
              const errors=[], failures=[];
              page.on('console',m=>{if(m.type()==='warning'||m.type()==='error')console.log('Browser '+width+': '+m.text())});
              page.on('pageerror',e=>errors.push(e.message));
              page.on('response',r=>{if(r.status()>=400)failures.push(r.url())});
              assert((await page.goto(url)).ok());
              await page.waitForFunction(()=>document.documentElement.dataset.shell==='ready'&&document.documentElement.dataset.release==='T10');
              assert(await page.locator('h1').isVisible());
              assert(await page.locator('.display-wordmark').isVisible());
              assert.equal(await page.locator('h1').count(),1);
              assert.equal(await page.locator('.wordmark').getAttribute('aria-label'),'Threshold home');
              assert(await page.locator('footer').isVisible());
              assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
              assert.equal(await page.locator('.gallery-link').evaluate(el=>new URL(el.href).pathname),'/index.html');
              await page.keyboard.press('Tab');
              assert(await page.locator('.skip-link').evaluate(el=>el===document.activeElement));
              await page.keyboard.press('Enter');
              assert(await page.locator('#main').evaluate(el=>el===document.activeElement));
              const stage=page.locator('#scene-study'),canvas=page.locator('#scene-canvas');
              await stage.scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>document.querySelector('#scene-study').dataset.renderer==='webgl');
              const [bw,bh]=(await stage.getAttribute('data-buffer')).split('x').map(Number);
              assert(bw*bh<=1500000);assert.equal(await stage.getAttribute('data-triangles'),'230');
              const [rw,rh]=(await stage.getAttribute('data-reflection-buffer')).split('x').map(Number);
              assert(rw*rh<=375000&&rw<=1024&&rh<=1024);
              assert(rw<=Math.max(1,bw*.5)&&rh<=Math.max(1,bh*.5));
              assert.equal(await stage.getAttribute('data-reflection'),'on');
              assert.equal(await stage.getAttribute('data-lighting'),'on');
              const desktop=width>=900&&height>=480&&width/height>=1.2;
              assert.equal(await stage.getAttribute('data-composition'),desktop?'desktop':'study');
              if(desktop){
                const layout=await page.evaluate(()=>{
                  const rect=s=>{const r=document.querySelector(s).getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};
                  return {canvas:rect('#scene-canvas'),copy:rect('.opening-copy'),header:rect('.masthead'),footer:rect('footer'),scroll:document.documentElement.scrollHeight,viewport:{w:innerWidth,h:innerHeight}};
                });
                assert(Math.abs(layout.canvas.x)<1&&Math.abs(layout.canvas.y)<1);
                assert(Math.abs(layout.canvas.w-width)<1&&Math.abs(layout.canvas.h-height)<2,'desktop full bleed');
                assert(layout.copy.right<width*.40&&layout.copy.y>layout.header.bottom&&layout.copy.bottom<layout.footer.y,'reserved copy region');
                assert(layout.scroll<=height+2,'no extra diagnostic scroll');
                await page.evaluate(()=>document.activeElement.blur());
                const mark=page.locator('.display-wordmark'),occluder=page.locator('#wordmark-occluder');
                assert(await mark.isVisible());assert.equal(await mark.getAttribute('data-depth'),'projected');
                assert.equal(await mark.getAttribute('aria-hidden'),'true');
                const points=await occluder.getAttribute('points');assert.equal(points.trim().split(/\s+/).length,4);
                const markBox=await mark.boundingBox();
                assert(markBox.x>=width*.039&&markBox.x+markBox.width<=width*.961);
                assert(markBox.y>=layout.header.bottom&&markBox.y+markBox.height<layout.copy.y,'wordmark separate from header and copy');
                await page.screenshot({path:'/tmp/threshold-evidence/opening-'+width+'x'+height+'.png'});
                if(width===1440){
                  const masked=await mark.screenshot({path:'/tmp/threshold-evidence/wordmark-masked.png'});
                  await occluder.evaluate(el=>el.setAttribute('points',''));
                  const unmasked=await mark.screenshot({path:'/tmp/threshold-evidence/wordmark-unmasked.png'});
                  await occluder.evaluate((el,p)=>el.setAttribute('points',p),points);
                  const a=await sharp(masked).removeAlpha().raw().toBuffer({resolveWithObject:true}),b=await sharp(unmasked).removeAlpha().raw().toBuffer({resolveWithObject:true});
                  assert.equal(a.info.width,b.info.width);assert.equal(a.info.height,b.info.height);
                  let changes=0,upperChanges=0;
                  for(let y=0;y<a.info.height;y++)for(let x=0;x<a.info.width;x++){
                    const i=(y*a.info.width+x)*a.info.channels;
                    if(Math.max(Math.abs(a.data[i]-b.data[i]),Math.abs(a.data[i+1]-b.data[i+1]),Math.abs(a.data[i+2]-b.data[i+2]))>16){changes++;if(y<a.info.height*.65)upperChanges++}
                  }
                  console.log('Wordmark occlusion',{changes,upperChanges});
                  assert(changes>100&&upperChanges<Math.max(20,changes*.01),'real lower-glyph occlusion with intact upper letters');
                }
                console.log('Desktop composition',width,layout);
              }
              const image=await canvas.screenshot({style:captureStyle,path:'/tmp/threshold-evidence/study-'+width+'x'+height+'.png'});
              const {data,info}=await sharp(image).removeAlpha().raw().toBuffer({resolveWithObject:true});
              let red=0,neutral=0;
              for(let i=0;i<data.length;i+=info.channels){const [r,g,b]=[data[i],data[i+1],data[i+2]];if(r>90&&r>1.6*g&&r>1.8*b)red++;if(g>105&&Math.abs(r-g)<25&&Math.abs(b-g)<25)neutral++}
              assert(red>100&&neutral>100,'visible red passage and ivory reveal');
              if(desktop){
                let left=info.width,right=0,top=info.height,bottom=0,n=0;
                for(let y=0;y<info.height*.79;y++)for(let x=0;x<info.width;x++){
                  const i=(y*info.width+x)*info.channels;
                  if(data[i]>140&&data[i]>1.8*data[i+1]&&data[i]>2*data[i+2]){left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y);n++}
                }
                assert(n>100&&left/info.width>.42&&right/info.width<.94,'visible red passage outside copy zone');
                assert(top/info.height>.08&&bottom/info.height<.80,'vertical framing');
              }
              if(width===1440||width===390){
                const plain=await browser.newPage({viewport:{width,height},deviceScaleFactor:width<=390?3:2});
                await plain.goto(url+'&reflection=off');
                await plain.locator('#scene-study').scrollIntoViewIfNeeded();
                await plain.waitForFunction(()=>document.querySelector('#scene-study').dataset.renderer==='webgl');
                const off=await plain.locator('#scene-canvas').screenshot({style:captureStyle,path:'/tmp/threshold-evidence/matte-'+width+'.png'});
                const {data:matte,info:mi}=await sharp(off).removeAlpha().raw().toBuffer({resolveWithObject:true});
                assert.equal(mi.width,info.width);assert.equal(mi.height,info.height);
                // Ground is now illuminated, so classify floor with an independent
                // depth-tested green mask instead of assuming a single matte RGB.
                await plain.goto(url+'&floorMask=on&reflection=off');
                await plain.locator('#scene-study').scrollIntoViewIfNeeded();
                await plain.waitForFunction(()=>document.querySelector('#scene-study').dataset.renderer==='webgl'&&document.querySelector('#scene-study').dataset.floorMask==='on');
                const maskShot=await plain.locator('#scene-canvas').screenshot({style:captureStyle,path:'/tmp/threshold-evidence/floor-mask-'+width+'.png'});
                const {data:mask,info:maskInfo}=await sharp(maskShot).removeAlpha().raw().toBuffer({resolveWithObject:true});
                assert.equal(maskInfo.width,info.width);assert.equal(maskInfo.height,info.height);
                let changed=0,redReflection=0,wallChanges=0;
                for(let i=0;i<data.length;i+=info.channels){
                  const delta=Math.max(Math.abs(data[i]-matte[i]),Math.abs(data[i+1]-matte[i+1]),Math.abs(data[i+2]-matte[i+2]));
                  if(delta>8){changed++;if(data[i]-matte[i]>12&&data[i]-data[i+1]>12)redReflection++;
                    if(mask[i+1]<Math.max(mask[i],mask[i+2])+30)wallChanges++;
                  }
                }
                console.log('Reflection '+width, {changed,redReflection,wallChanges});
                assert(changed>150&&redReflection>50,'actual red floor reflection');
                assert(wallChanges<Math.max(100,changed*.06),'reflection confined to floor apart from antialias edges');
                await plain.goto(url+'&lighting=off&reflection=off');
                await plain.locator('#scene-study').scrollIntoViewIfNeeded();
                await plain.waitForFunction(()=>document.querySelector('#scene-study').dataset.renderer==='webgl'&&document.querySelector('#scene-study').dataset.lighting==='off');
                const flatShot=await plain.locator('#scene-canvas').screenshot({style:captureStyle,path:'/tmp/threshold-evidence/unlit-'+width+'.png'});
                const {data:flat,info:fi}=await sharp(flatShot).removeAlpha().raw().toBuffer({resolveWithObject:true});
                assert.equal(fi.width,info.width);assert.equal(fi.height,info.height);
                let brightRed=0,spillPixels=0,nonFloorChanges=0,whiteClipped=0;
                for(let i=0;i<flat.length;i+=fi.channels){
                  const isFloor=mask[i+1]>Math.max(mask[i],mask[i+2])+100;
                  if(isFloor&&matte[i]>flat[i]+8&&matte[i]-matte[i+1]>10)spillPixels++;
                  if(!isFloor&&flat[i]>90&&flat[i]>flat[i+1]*1.6&&matte[i]>flat[i]+8)brightRed++;
                  if(!isFloor&&Math.max(...[0,1,2].map(k=>Math.abs(matte[i+k]-flat[i+k])))>8)nonFloorChanges++;
                  if(matte[i]>250&&matte[i+1]>250&&matte[i+2]>250)whiteClipped++;
                }
                console.log('Lighting '+width,{brightRed,spillPixels,nonFloorChanges,whiteClipped});
                assert(brightRed>100&&spillPixels>100&&nonFloorChanges>100,'emission and direct floor spill without reflection');
                assert(whiteClipped<info.width*info.height*.005,'no broad white clipping');
                await plain.close();
              }
              await page.waitForTimeout(150);
              const before=await stage.getAttribute('data-frames');
              await page.waitForTimeout(300);
              assert.equal(await stage.getAttribute('data-frames'),before,'idle frame loop');
              if(width===390){
                await page.setViewportSize({width:430,height:932});
                await page.waitForFunction(n=>Number(document.querySelector('#scene-study').dataset.frames)>n,Number(before));
                await page.emulateMedia({reducedMotion:'reduce'});
                await page.waitForFunction(()=>document.querySelector('#scene-study').dataset.reason==='reduced-motion');
                assert(await page.locator('.scene-fallback').isVisible());
                await page.emulateMedia({reducedMotion:'no-preference'});
                await page.waitForFunction(()=>document.querySelector('#scene-study').dataset.renderer==='webgl');
                // Move the surface fully below viewport, then verify no resize draw while offscreen.
                await page.evaluate(()=>{const el=document.querySelector('#scene-study');el.style.marginTop='250vh';window.scrollTo(0,0)});
                await page.waitForTimeout(250);
                const off=await stage.getAttribute('data-frames');
                await page.setViewportSize({width:420,height:930});
                await page.waitForTimeout(250);assert.equal(await stage.getAttribute('data-frames'),off);
                await stage.scrollIntoViewIfNeeded();
                await page.waitForFunction(n=>Number(document.querySelector('#scene-study').dataset.frames)>n,Number(off));
                // Restore is asynchronous in Chromium; wait for the loss event and
                // allow the browser's context-loss recovery interval before requesting it.
                const supported=await canvas.evaluate(el=>{
                  const gl=el.getContext('webgl2'),ext=gl.getExtension('WEBGL_lose_context');
                  if(!ext)return false;
                  window.__thresholdRecovery={gl,ext,lost:0,restored:0};
                  el.addEventListener('webglcontextlost',()=>window.__thresholdRecovery.lost++);
                  el.addEventListener('webglcontextrestored',()=>window.__thresholdRecovery.restored++);
                  ext.loseContext();return true;
                });
                assert(supported,'context-loss extension required for CI');
                await page.waitForFunction(()=>document.querySelector('#scene-study').dataset.reason==='context-lost'&&window.__thresholdRecovery.lost===1);
                assert(await page.locator('.scene-fallback').isVisible());
                const lostFrames=Number(await stage.getAttribute('data-frames'));
                await page.waitForTimeout(1000);
                try{
                  await page.evaluate(()=>window.__thresholdRecovery.ext.restoreContext());
                  await page.waitForFunction(()=>window.__thresholdRecovery.restored===1,{},{timeout:10000});
                  await page.waitForFunction(n=>{const d=document.querySelector('#scene-study').dataset;return d.renderer==='webgl'&&Number(d.frames)>n},lostFrames,{timeout:10000});
                  assert(await canvas.isVisible());
                  const [rrw,rrh]=(await stage.getAttribute('data-reflection-buffer')).split('x').map(Number);assert(rrw*rrh<=375000&&rrw>0&&rrh>0);
                  assert(await canvas.evaluate(el=>!el.getContext('webgl2').isContextLost()));
                  const recovered=await canvas.screenshot({style:captureStyle,path:'/tmp/threshold-evidence/recovered-390.png'});
                  const {data:rgb,info:meta}=await sharp(recovered).removeAlpha().raw().toBuffer({resolveWithObject:true});
                  let redAfter=0,neutralAfter=0;
                  for(let i=0;i<rgb.length;i+=meta.channels){const [r,g,b]=[rgb[i],rgb[i+1],rgb[i+2]];if(r>90&&r>1.6*g&&r>1.8*b)redAfter++;if(g>105&&Math.abs(r-g)<25&&Math.abs(b-g)<25)neutralAfter++}
                  assert(redAfter>100&&neutralAfter>100,'actual recovered passage and ivory reveal');
                  assert(await canvas.evaluate(el=>{const gl=el.getContext('webgl2');return gl.getError()===gl.NO_ERROR}),'no residual GPU error');
                }catch(error){
                  const state=await page.evaluate(()=>({dataset:{...document.querySelector('#scene-study').dataset},lost:window.__thresholdRecovery.lost,restored:window.__thresholdRecovery.restored,contextLost:window.__thresholdRecovery.gl.isContextLost(),visibility:document.visibilityState}));
                  writeFileSync('/tmp/threshold-evidence/recovery-failure.json',JSON.stringify(state,null,2));
                  console.error('Recovery diagnostic',state);throw error;
                }
              }
              assert.deepEqual(errors,[]);assert.deepEqual(failures,[]);
              await page.close();
            }
            // Run the default animated route separately from deterministic material comparisons.
            const moving=await browser.newPage({viewport:{width:1024,height:768},deviceScaleFactor:1});
            const movingErrors=[];moving.on('pageerror',e=>movingErrors.push(e.message));
            await moving.goto(baseURL);
            const movingStage=moving.locator('#scene-study'),movingCanvas=moving.locator('#scene-canvas');
            await moving.waitForFunction(()=>document.querySelector('#scene-study').dataset.renderer==='webgl'&&document.querySelector('#scene-study').dataset.ambient==='on');
            const maskBefore=await moving.locator('#wordmark-occluder').getAttribute('points');
            const early=await movingCanvas.screenshot({style:captureStyle,path:'/tmp/threshold-evidence/ambient-early.png'});
            const start=Number(await movingStage.getAttribute('data-ambient-elapsed'));
            const firstFrames=Number(await movingStage.getAttribute('data-frames'));
            await moving.waitForFunction(n=>Number(document.querySelector('#scene-study').dataset.ambientElapsed)>n+2500,start,{timeout:20000});
            const later=await movingCanvas.screenshot({style:captureStyle,path:'/tmp/threshold-evidence/ambient-later.png'});
            assert(Number(await movingStage.getAttribute('data-frames'))>firstFrames+10);
            assert.equal(await moving.locator('#wordmark-occluder').getAttribute('points'),maskBefore,'fixed camera projection');
            const a=await sharp(early).removeAlpha().raw().toBuffer({resolveWithObject:true}),b=await sharp(later).removeAlpha().raw().toBuffer({resolveWithObject:true});
            assert.equal(a.info.width,b.info.width);assert.equal(a.info.height,b.info.height);
            let changed=0,maxDelta=0;
            for(let i=0;i<a.data.length;i+=a.info.channels){
              const d=Math.max(...[0,1,2].map(k=>Math.abs(a.data[i+k]-b.data[i+k])));
              if(d>=2)changed++;maxDelta=Math.max(maxDelta,d);
            }
            console.log('Ambient pixel change',{changed,maxDelta});
            assert(changed>100&&maxDelta<=26,'subtle actual illumination motion');
            await moving.emulateMedia({reducedMotion:'reduce'});
            await moving.waitForFunction(()=>document.querySelector('#scene-study').dataset.reason==='reduced-motion');
            const frozen=Number(await movingStage.getAttribute('data-ambient-elapsed')),frozenFrames=await movingStage.getAttribute('data-frames');
            await moving.waitForTimeout(500);
            assert.equal(await movingStage.getAttribute('data-frames'),frozenFrames);
            assert.equal(Number(await movingStage.getAttribute('data-ambient-elapsed')),frozen);
            await moving.emulateMedia({reducedMotion:'no-preference'});
            await moving.waitForFunction(()=>document.querySelector('#scene-study').dataset.renderer==='webgl');
            const resumed=Number(await movingStage.getAttribute('data-ambient-elapsed'));
            assert(resumed>=frozen&&resumed-frozen<350,'no phase catch-up');
            assert.deepEqual(movingErrors,[]);await moving.close();
            // Desktop static fallback retains the same full viewport and usable copy.
            for(const opts of [{javaScriptEnabled:false},{reducedMotion:'reduce'}]){
              const staticDesktop=await browser.newPage({viewport:{width:1440,height:900},...opts});
              await staticDesktop.goto(url);
              assert(await staticDesktop.locator('h1').isVisible());
              assert(await staticDesktop.locator('.display-wordmark').isVisible());
              assert.equal(await staticDesktop.locator('#wordmark-occluder').getAttribute('points'),'');
              assert(await staticDesktop.locator('.scene-fallback').isVisible());
              assert(await staticDesktop.locator('#scene-canvas').isHidden());
              assert(await staticDesktop.evaluate(()=>document.documentElement.scrollWidth<=innerWidth&&document.documentElement.scrollHeight<=innerHeight+2));
              await staticDesktop.screenshot({path:'/tmp/threshold-evidence/desktop-static-'+(opts.javaScriptEnabled===false?'nojs':'reduced')+'.png'});
              await staticDesktop.close();
            }
            for(const opts of [{javaScriptEnabled:false},{reducedMotion:'reduce'}]) {
              const page=await browser.newPage({viewport:{width:390,height:844},...opts});
              assert((await page.goto(url)).ok());
              assert(await page.locator('h1').isVisible());
              assert(await page.locator('#scene-canvas').isHidden());
              assert(await page.locator('.scene-fallback').isVisible());
              await page.close();
            }
            const unavailable=await browser.newPage({viewport:{width:390,height:844}});
            await unavailable.addInitScript(()=>{const original=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,...args){return type==='webgl2'?null:original.call(this,type,...args)}});
            await unavailable.goto(url);
            await unavailable.locator('#scene-study').scrollIntoViewIfNeeded();
            await unavailable.waitForFunction(()=>document.querySelector('#scene-study').dataset.reason==='graphics-unavailable');
            assert(await unavailable.locator('.scene-fallback').isVisible());await unavailable.close();
            writeFileSync('/tmp/threshold-evidence/report.json',JSON.stringify({release:'T10',verification:'T10',commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,viewports:7,pixelChecks:true,architecture:true,reflection:true,lighting:true,desktopComposition:true,identity:true,ambient:true,resize:true,idle:true,offscreen:true,contextRecovery:true,staticFallbacks:true},null,2));
            console.log('PASS: seven viewport pixel/lifecycle checks and static fallbacks');
          } finally {await browser.close()}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threshold-ambient-evidence
          path: /tmp/threshold-evidence/
