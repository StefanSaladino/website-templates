name: STICAZZI draft interaction review
on:
  push:
    paths:
      - 'templates/_drafts/sticazzi-coffee/**'
      - '.github/workflows/sticazzi-draft-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: node --check templates/_drafts/sticazzi-coffee/src/hero.js
      - run: python templates/_drafts/sticazzi-coffee/audit/test-s08b4.py
      - run: python templates/_drafts/sticazzi-coffee/audit/test-s08c2.py
      - run: python templates/_drafts/sticazzi-coffee/audit/test-s08d.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sticazzi-s08d-frames
          path: templates/_drafts/sticazzi-coffee/audit/captures/
