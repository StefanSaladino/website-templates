name: Cinematic website template QA
on:
  push:
    branches: [feature/component-showroom]
    paths: ['templates/**','components/data/cinematic-tests.json','components/scripts/test-cinematic-template.mjs','.github/workflows/cinematic-template-qa.yml']
  pull_request:
    paths: ['templates/**','components/data/cinematic-tests.json','components/scripts/test-cinematic-template.mjs','.github/workflows/cinematic-template-qa.yml']
permissions:
  contents: read
concurrency:
  group: cinematic-template-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: components
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node scripts/check-template-scripts.mjs && node scripts/check-template-a11y.mjs && node scripts/test-cinematic-template.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-template-evidence
          path: components/cinematic-evidence
          retention-days: 7
