name: SELVEDGE storyboard review
on:
  push:
    branches: [feature/component-showroom]
    paths:
      - 'templates/_drafts/selvedge-outerwear/**'
      - 'components/scripts/test-selvedge-storyboard.mjs'
      - '.github/workflows/selvedge-storyboard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storyboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: components
      - run: node scripts/test-selvedge-storyboard.mjs
        working-directory: components
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selvedge-storyboard-evidence
          path: components/selvedge-evidence/
          if-no-files-found: warn
