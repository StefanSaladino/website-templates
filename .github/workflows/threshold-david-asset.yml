name: THRESHOLD David asset preparation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'templates/_drafts/threshold-studio/audit/prepare-david.py'
      - '.github/workflows/threshold-david-asset.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire attributed Scan the World source
        run: |
          curl --fail --location --retry 2 --max-time 180 \
            --user-agent 'THRESHOLDStudioAssetPrep/1.0 (https://boomerautomation.com; Scan the World model preparation)' \
            'https://upload.wikimedia.org/wikipedia/commons/4/4d/David_%28Michelangelo%29.stl' \
            --output /tmp/david.stl
      - name: Optimize and inspect actual 3D model
        run: |
          python -m pip install 'numpy==2.4.6' 'scipy>=1.15,<2' 'trimesh==4.12.2' 'fast-simplification==0.1.13' 'pillow==12.3.0'
          python templates/_drafts/threshold-studio/audit/prepare-david.py /tmp/david.stl /tmp/threshold-david
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threshold-david-source-review
          path: /tmp/threshold-david/
      - name: Stage verified mesh for review (never publish to main)
        run: |
          dir=templates/_drafts/threshold-studio/assets/david
          mkdir -p "$dir"
          cp /tmp/threshold-david/david.mesh.json /tmp/threshold-david/david.glb /tmp/threshold-david/report.json "$dir/"
          git config user.name 'threshold-asset-prep[bot]'
          git config user.email 'threshold-asset-prep[bot]@users.noreply.github.com'
          git add "$dir"
          git commit -m "Prepare attributed David mesh for review"
          git push origin "HEAD:refs/heads/threshold-david-asset-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
