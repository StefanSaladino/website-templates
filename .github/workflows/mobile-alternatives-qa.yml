name: Independent mobile alternatives browser review
on:
  push:
    branches:
      - feature/component-showroom
    paths:
      - 'components/previews/**'
      - 'components/data/mobile-treatments.json'
      - 'components/scripts/audit-mobile-alternatives.mjs'
      - '.github/workflows/mobile-alternatives-qa.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    name: All alternate phone compositions at 320 and 390
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium dependencies
        working-directory: components
        run: npm install --no-audit --no-fund
      - name: Render independent alt layouts and check selected state
        working-directory: components
        run: npm run review:mobile-alternatives
      - name: Save all alternative screenshots and review ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-alternative-evidence
          path: components/mobile-alternative-evidence/
          if-no-files-found: warn
          retention-days: 14
