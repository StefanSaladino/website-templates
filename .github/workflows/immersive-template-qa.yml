name: Immersive website template QA
on:
  push:
    branches: [feature/component-showroom]
    paths: ['templates/fulcrum-light/**','components/scripts/test-immersive-template.mjs','.github/workflows/immersive-template-qa.yml']
  pull_request:
    paths: ['templates/fulcrum-light/**','components/scripts/test-immersive-template.mjs','.github/workflows/immersive-template-qa.yml']
permissions:
  contents: read
concurrency:
  group: immersive-template-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: components
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node scripts/check-template-scripts.mjs && node scripts/check-template-a11y.mjs && node scripts/check-gallery-integrity.mjs
      - run: node scripts/test-immersive-template.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immersive-template-evidence
          path: components/immersive-evidence
          retention-days: 7
