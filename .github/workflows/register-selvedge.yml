name: Publish SELVEDGE gallery-only review candidate
on:
  push:
    branches: [feature/component-showroom]
    paths:
      - '.github/workflows/register-selvedge.yml'
      - 'components/scripts/prepare-selvedge-registration.mjs'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: selvedge-registration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    if: github.ref == 'refs/heads/feature/component-showroom'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: components
      - name: Prepare gallery-only source
        working-directory: components
        run: node scripts/prepare-selvedge-registration.mjs
      - name: Capture exact opening from registered source
        working-directory: components
        run: node scripts/capture-gallery-openings.mjs --only=selvedge-outerwear --apply
      - name: Verify complete build and explicit configurator gate
        working-directory: components
        run: npm run build
      - name: Verify gallery-only public membership
        working-directory: components
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';import {catalogue} from './builder-model.js';const data=JSON.parse(readFileSync('data/builder-templates.json'));assert.equal(data.length,36);assert.equal(data.find(x=>x.slug==='selvedge-outerwear').configuratorStatus,'gallery-only');assert.equal(catalogue([],[],data,[]).templates.size,35);assert(!catalogue([],[],data,[]).templates.has('selvedge-outerwear'));"
      - name: Preserve exact screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: selvedge-gallery-only-evidence
          path: components/gallery-opening-evidence/
          retention-days: 14
      - name: Publish validated gallery-only commit for promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- templates index.html components/data/builder-templates.json components/data/template-media-inventory.json components/data/loaded-media-review-batches.json components/data/immersive-tests.json components/data/gallery-opening-captures.json components/builder-journey.js components/builder.js components/builder.html components/scripts/check-immersive-contract.mjs components/scripts/test-selvedge-storyboard.mjs components/scripts/capture-gallery-openings.mjs .github/workflows/selvedge-storyboard.yml docs/TEMPLATE-MEDIA-CLEARANCE-QUEUE.md docs/SELVEDGE-OUTERWEAR-ROADMAP.md
          git diff --cached --stat
          git commit -m "feat(gallery): register SELVEDGE as gallery-only with exact opening capture"
          git push origin HEAD:refs/heads/selvedge-registration/${GITHUB_SHA}
