name: Original templates text spacing and reflow QA
on:
  push:
    branches:
      - feature/component-showroom
    paths:
      - 'templates/**'
      - 'components/scripts/template-catalogue.mjs'
      - 'components/scripts/audit-text-spacing-reflow.mjs'
      - '.github/workflows/original-template-reflow-qa.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reflow:
    name: Review all complete templates at effective 200-400 percent reflow widths
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser dependency
        working-directory: components
        run: npm install --no-audit --no-fund
      - name: Check system Chrome and local server
        run: |
          command -v google-chrome || command -v chromium
          python3 --version
      - name: Check baseline and enlarged text spacing at 320/640 CSS px
        working-directory: components
        run: npm run review:reflow-text-spacing
      - name: Save reflow screenshots and clipping ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-templates-reflow-evidence
          path: components/reflow-text-spacing-evidence/
          if-no-files-found: warn
          retention-days: 14
