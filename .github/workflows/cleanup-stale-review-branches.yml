name: One-time stale review branch cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-stale-review-branches.yml']
permissions:
  contents: write
  pages: read
jobs:
  prune:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Report Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,source}' || echo "Pages source could not be read"
      - name: Delete only audited unchanged candidate branches
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected branch; do
            ref="refs/heads/$branch"
            actual="$(git ls-remote --heads origin "$ref" | cut -f1)"
            if [[ -z "$actual" ]]; then
              echo "Already absent: $branch"
            elif [[ "$actual" != "$expected" ]]; then
              echo "::warning::Preserved changed branch $branch"
            else
              git push --force-with-lease="$ref:$expected" origin ":$ref"
              echo "DELETED $branch"
            fi
          done <<'REFS'
