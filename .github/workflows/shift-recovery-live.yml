name: SHIFT recovery live composition
on:
  push:
    branches: [feature/component-showroom]
    paths: ['templates/_drafts/shift-recovery/**','templates/shift-card/**','components/previews/ANIM-21/**','components/previews/ANIM-22/**','components/scripts/test-shift-components.mjs','components/scripts/test-shift-model.mjs','components/scripts/test-shift-recovery-live.mjs','components/scripts/test-shift-cadence-isolated.mjs','components/scripts/test-shift-recovery-projection.mjs','components/scripts/test-shift-recovery-accessibility.mjs','.github/workflows/shift-recovery-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    defaults:
      run:
        working-directory: components
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node scripts/test-shift-recovery-projection.mjs
      - run: npx playwright install ffmpeg
      - run: node scripts/test-shift-recovery-accessibility.mjs
      - run: node scripts/test-shift-recovery-live.mjs
        if: success() || failure()
      - run: node scripts/test-shift-cadence-isolated.mjs
        if: success() || failure()
      - run: node scripts/test-shift-model.mjs
        if: success() || failure()
      - run: node scripts/test-shift-components.mjs
        if: success() || failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shift-recovery-live-evidence
          path: |
            components/shift-recovery-live-evidence
            components/shift-storyboard-evidence
          retention-days: 7
